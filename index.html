<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocabs</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="app" class="app-shell">

        <main class="app-container">

            <!-- Loading -->
            <div v-if="isLoading" class="flex min-h-[70vh] items-center justify-center">
                <div class="flex items-center gap-3">

                    <span class="material-symbols-outlined animate-spin">
                        progress_activity
                    </span>

                    <span class="text-sm text-zinc-500 dark:text-zinc-400">
                        Loading...
                    </span>

                </div>
            </div>

            <!-- Error -->
            <div v-else-if="errorMessage" class="surface p-5">
                <div class="flex items-start gap-3">

                    <span class="material-symbols-outlined text-zinc-600 dark:text-zinc-300">
                        error
                    </span>

                    <div>
                        <h2 class="font-display font-semibold">
                            Something went wrong
                        </h2>

                        <p class="mt-1 text-sm leading-5 text-zinc-500 dark:text-zinc-400">
                            {{ errorMessage }}
                        </p>
                    </div>

                </div>
            </div>

            <!-- Language Selection -->
            <template v-else-if="currentScreen === 'language'">

                <header class="pt-4">

                    <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                        Vocabulary Learning
                    </p>

                    <h1 class="mt-2 font-display text-3xl font-bold tracking-tight">
                        Choose a language
                    </h1>

                    <p class="mt-2 max-w-sm text-sm leading-6 text-zinc-500 dark:text-zinc-400">
                        Select the language you want to use for your vocabulary session.
                    </p>

                </header>

                <section class="mt-8">

                    <div class="space-y-2">

                        <button v-for="language in languages" :key="language.id" type="button"
                            class="group flex w-full items-center gap-4 rounded-xl border border-zinc-200 bg-white p-4 text-left transition hover:border-zinc-400 hover:bg-zinc-50 active:scale-[0.99] dark:border-zinc-800 dark:bg-zinc-900 dark:hover:border-zinc-600 dark:hover:bg-zinc-800"
                            @click="selectLanguage(language.id)">

                            <!-- Language Icon -->
                            <div
                                class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-zinc-100 dark:bg-zinc-800">
                                <span v-if="language.id === 'arabic'" class="text-lg font-semibold" dir="rtl">
                                    ع
                                </span>

                                <span v-else-if="language.id === 'french'" class="text-lg font-semibold">
                                    Fr
                                </span>

                                <span v-else-if="language.id === 'english_us'" class="text-lg font-semibold">
                                    En
                                </span>

                                <span v-else-if="language.id === 'indonesian'" class="text-lg font-semibold">
                                    Id
                                </span>

                                <span v-else class="text-lg font-semibold">
                                    Mg
                                </span>
                            </div>

                            <!-- Language Information -->
                            <div class="min-w-0 flex-1">

                                <div class="flex items-center justify-between gap-3">

                                    <h2 class="font-display text-sm font-semibold">
                                        {{ language.name }}
                                    </h2>

                                    <span
                                        class="material-symbols-outlined text-zinc-400 transition-transform group-hover:translate-x-0.5">
                                        arrow_forward
                                    </span>

                                </div>

                                <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400"
                                    :dir="language.id === 'arabic' ? 'rtl' : 'ltr'">
                                    {{ language.nativeName }}
                                </p>

                            </div>

                        </button>

                    </div>

                </section>

                <footer class="mt-8">

                    <p class="text-center text-xs text-zinc-400">
                        {{ languageCount }} languages available
                    </p>

                </footer>

            </template>

            <!-- Category Selection -->
            <template v-else-if="currentScreen === 'category'">

                <header class="pt-4">

                    <div class="flex items-center gap-3">

                        <button type="button"
                            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-zinc-200 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800"
                            aria-label="Back to language selection" @click="goToLanguageSelection">
                            <span class="material-symbols-outlined">
                                arrow_back
                            </span>
                        </button>

                        <div class="min-w-0">

                            <p class="text-xs font-medium text-zinc-400">
                                Language
                            </p>

                            <h1 class="mt-0.5 truncate font-display text-lg font-semibold"
                                :dir="selectedLanguage === 'arabic' ? 'rtl' : 'ltr'">
                                {{ currentLanguage.name }}
                            </h1>

                        </div>

                    </div>

                    <div class="mt-8">

                        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                            Vocabulary
                        </p>

                        <h2 class="mt-1 font-display text-3xl font-bold tracking-tight">
                            Choose a topic
                        </h2>

                        <p class="mt-2 text-sm leading-6 text-zinc-500 dark:text-zinc-400">
                            Select what you want to learn.
                        </p>

                    </div>

                </header>

                <section class="mt-8">

                    <div class="grid grid-cols-2 gap-3">

                        <button v-for="category in categories" :key="category.id" type="button"
                            class="group overflow-hidden rounded-xl border border-zinc-200 bg-white text-left transition hover:border-zinc-400 hover:bg-zinc-50 active:scale-[0.99] dark:border-zinc-800 dark:bg-zinc-900 dark:hover:border-zinc-600 dark:hover:bg-zinc-800"
                            @click="selectCategory(category.id)">

                            <!-- Category Image -->
                            <div class="aspect-[4/3] overflow-hidden bg-zinc-100 dark:bg-zinc-800">

                                <img :src="getCategoryImage(category)" :alt="category.name"
                                    class="h-full w-full object-cover" loading="lazy"
                                    @error="$event.target.style.display = 'none'">

                                <div class="flex h-full w-full items-center justify-center">
                                    <span class="material-symbols-outlined text-3xl text-zinc-300 dark:text-zinc-600">
                                        category
                                    </span>
                                </div>

                            </div>

                            <!-- Category Information -->
                            <div class="p-4">

                                <div class="flex items-start justify-between gap-2">

                                    <h3 class="font-display text-sm font-semibold leading-5">
                                        {{ category.name }}
                                    </h3>

                                    <span
                                        class="material-symbols-outlined shrink-0 text-lg text-zinc-400 transition-transform group-hover:translate-x-0.5">
                                        arrow_forward
                                    </span>

                                </div>

                                <p class="mt-1.5 text-xs leading-5 text-zinc-500 dark:text-zinc-400">
                                    {{ category.description }}
                                </p>

                            </div>

                        </button>

                    </div>

                </section>

                <footer class="mt-8">

                    <p class="text-center text-xs text-zinc-400">
                        {{ categoryCount }} vocabulary topics
                    </p>

                </footer>

            </template>

            <!-- Learning Mode Selection -->
            <template v-else-if="currentScreen === 'mode'">

                <header class="pt-4">

                    <!-- Back -->
                    <div class="flex items-center gap-3">

                        <button type="button"
                            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-zinc-200 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800"
                            aria-label="Back to vocabulary selection" @click="goToCategorySelection">
                            <span class="material-symbols-outlined">
                                arrow_back
                            </span>
                        </button>

                        <div class="min-w-0">

                            <p class="text-xs font-medium text-zinc-400">
                                Vocabulary
                            </p>

                            <h1 class="mt-0.5 truncate font-display text-lg font-semibold">
                                {{ currentCategory?.name }}
                            </h1>

                        </div>

                    </div>

                    <!-- Title -->
                    <div class="mt-8">

                        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                            Learning mode
                        </p>

                        <h2 class="mt-1 font-display text-3xl font-bold tracking-tight">
                            How do you want to learn?
                        </h2>

                        <p class="mt-2 text-sm leading-6 text-zinc-500 dark:text-zinc-400">
                            Choose a learning method for
                            <span class="font-medium text-zinc-700 dark:text-zinc-200">
                                {{ currentCategory?.name }}
                            </span>.
                        </p>

                    </div>

                </header>

                <!-- Mode List -->
                <section class="mt-8">

                    <div class="space-y-2">

                        <button v-for="mode in learningModes" :key="mode.id" type="button"
                            class="group flex w-full items-center gap-4 rounded-xl border border-zinc-200 bg-white p-4 text-left transition hover:border-zinc-400 hover:bg-zinc-50 active:scale-[0.99] dark:border-zinc-800 dark:bg-zinc-900 dark:hover:border-zinc-600 dark:hover:bg-zinc-800"
                            @click="selectMode(mode.id)">

                            <!-- Icon -->
                            <div
                                class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-zinc-100 dark:bg-zinc-800">
                                <span class="material-symbols-outlined text-zinc-700 dark:text-zinc-200">
                                    {{ mode.icon }}
                                </span>
                            </div>

                            <!-- Text -->
                            <div class="min-w-0 flex-1">

                                <div class="flex items-center justify-between gap-3">

                                    <h3 class="font-display text-sm font-semibold">
                                        {{ mode.name }}
                                    </h3>

                                    <span
                                        class="material-symbols-outlined shrink-0 text-lg text-zinc-400 transition-transform group-hover:translate-x-0.5">
                                        arrow_forward
                                    </span>

                                </div>

                                <p class="mt-1.5 text-xs leading-5 text-zinc-500 dark:text-zinc-400">
                                    {{ mode.description }}
                                </p>

                            </div>

                        </button>

                    </div>

                </section>

                <!-- Session Information -->
                <section class="mt-6 surface p-4">

                    <div class="flex items-center justify-between">

                        <div>

                            <p class="text-xs text-zinc-400">
                                Language
                            </p>

                            <p class="mt-1 text-sm font-medium" :dir="selectedLanguage === 'arabic' ? 'rtl' : 'ltr'">
                                {{ currentLanguage?.nativeName }}
                            </p>

                        </div>

                        <div class="h-8 w-px bg-zinc-200 dark:bg-zinc-800"></div>

                        <div class="text-right">

                            <p class="text-xs text-zinc-400">
                                Items
                            </p>

                            <p class="mt-1 text-sm font-medium">
                                {{ vocabulary.length }}
                            </p>

                        </div>

                    </div>

                </section>

                <footer class="mt-6">

                    <p class="text-center text-xs text-zinc-400">
                        {{ modeCount }} learning modes
                    </p>

                </footer>

            </template>

            <!-- Browse Vocabulary -->
            <template v-else-if="currentScreen === 'learning' && selectedMode === 'browse'">

                <!-- Header -->
                <header class="pt-4">

                    <div class="flex items-center gap-3">

                        <button type="button"
                            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-zinc-200 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800"
                            aria-label="Back to learning modes" @click="goToModeSelection">
                            <span class="material-symbols-outlined">
                                arrow_back
                            </span>
                        </button>

                        <div class="min-w-0">

                            <p class="text-xs font-medium text-zinc-400">
                                {{ currentLanguage?.name }}
                            </p>

                            <h1 class="mt-0.5 truncate font-display text-lg font-semibold">
                                {{ currentCategory?.name }}
                            </h1>

                        </div>

                    </div>

                    <div class="mt-8">

                        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                            Browse
                        </p>

                        <h2 class="mt-1 font-display text-3xl font-bold tracking-tight">
                            Vocabulary
                        </h2>

                        <p class="mt-2 text-sm leading-6 text-zinc-500 dark:text-zinc-400">
                            Tap a word to hear its pronunciation.
                        </p>

                    </div>

                </header>

                <!-- Vocabulary Grid -->
                <section class="mt-8">

                    <div class="grid grid-cols-2 gap-3">

                        <button v-for="item in vocabulary" :key="item.id" type="button"
                            class="group overflow-hidden rounded-xl border border-zinc-200 bg-white text-left transition hover:border-zinc-400 hover:bg-zinc-50 active:scale-[0.98] dark:border-zinc-800 dark:bg-zinc-900 dark:hover:border-zinc-600 dark:hover:bg-zinc-800"
                            @click="speakVocabulary(item)">

                            <!-- Image -->
                            <div class="relative aspect-square overflow-hidden bg-zinc-100 dark:bg-zinc-800">

                                <img :src="getVocabularyImage(item, selectedCategory)"
                                    :alt="getVocabularyText(item, selectedLanguage)" class="h-full w-full object-cover"
                                    loading="lazy" @error="$event.target.style.display = 'none'">

                                <div class="absolute inset-0 flex items-center justify-center">

                                    <span class="material-symbols-outlined text-3xl text-zinc-300 dark:text-zinc-600">
                                        image
                                    </span>

                                </div>

                                <!-- Audio Indicator -->
                                <div
                                    class="absolute bottom-2 right-2 flex h-8 w-8 items-center justify-center rounded-full border border-zinc-200 bg-white/90 text-zinc-700 shadow-sm backdrop-blur dark:border-zinc-700 dark:bg-zinc-900/90 dark:text-zinc-200">
                                    <span class="material-symbols-outlined text-lg">
                                        volume_up
                                    </span>
                                </div>

                            </div>

                            <!-- Vocabulary -->
                            <div class="p-3">

                                <p class="font-display text-sm font-semibold leading-5"
                                    :dir="selectedLanguage === 'arabic' ? 'rtl' : 'ltr'">
                                    {{ getVocabularyText(item, selectedLanguage) }}
                                </p>

                            </div>

                        </button>

                    </div>

                </section>

                <!-- Footer -->
                <footer class="mt-8">

                    <p class="text-center text-xs text-zinc-400">
                        {{ vocabulary.length }} vocabulary items
                    </p>

                </footer>

            </template>

            <!-- Placeholder for remaining screens -->

            <!-- Remaining screens -->
            <template v-else>

                <section class="pt-8">

                    <h1 class="font-display text-2xl font-bold">
                        Learning
                    </h1>

                    <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">
                        This learning mode will be implemented next.
                    </p>

                </section>

            </template>

            <!-- Learn One by One -->
            <template v-else-if="currentScreen === 'learning' && selectedMode === 'one_by_one'">

                <!-- Header -->
                <header class="pt-4">

                    <div class="flex items-center gap-3">

                        <button type="button"
                            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-zinc-200 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800"
                            aria-label="Back to learning modes" @click="goToModeSelection">
                            <span class="material-symbols-outlined">
                                arrow_back
                            </span>
                        </button>

                        <div class="min-w-0">

                            <p class="text-xs font-medium text-zinc-400">
                                {{ currentCategory?.name }}
                            </p>

                            <h1 class="mt-0.5 truncate font-display text-lg font-semibold">
                                Learn One by One
                            </h1>

                        </div>

                    </div>

                </header>

                <!-- Progress -->
                <section class="mt-8">

                    <div class="flex items-center justify-between">

                        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                            Vocabulary
                        </p>

                        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                            {{ currentIndex + 1 }} / {{ vocabulary.length }}
                        </p>

                    </div>

                    <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-zinc-100 dark:bg-zinc-800">

                        <div class="h-full rounded-full bg-zinc-900 transition-all duration-300 dark:bg-zinc-100"
                            :style="{
            width: `${((currentIndex + 1) / vocabulary.length) * 100}%`
          }"></div>

                    </div>

                </section>

                <!-- Vocabulary -->
                <section v-if="currentItem" class="mt-8">

                    <!-- Image -->
                    <div
                        class="overflow-hidden rounded-2xl border border-zinc-200 bg-zinc-100 dark:border-zinc-800 dark:bg-zinc-900">

                        <div class="aspect-square">

                            <img :src="getVocabularyImage(currentItem, selectedCategory)"
                                :alt="getVocabularyText(currentItem, selectedLanguage)"
                                class="h-full w-full object-cover" @error="$event.target.style.display = 'none'">

                        </div>

                    </div>

                    <!-- Word -->
                    <div class="mt-6 text-center">

                        <p class="font-display text-3xl font-bold tracking-tight"
                            :dir="selectedLanguage === 'arabic' ? 'rtl' : 'ltr'">
                            {{ getVocabularyText(currentItem, selectedLanguage) }}
                        </p>

                        <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">
                            {{ currentLanguage?.name }}
                        </p>

                    </div>

                </section>

                <!-- Controls -->
                <section class="mt-8">

                    <div class="grid grid-cols-2 gap-3">

                        <!-- Replay -->
                        <button type="button"
                            class="flex h-12 items-center justify-center gap-2 rounded-xl border border-zinc-200 font-medium transition hover:bg-zinc-100 active:scale-[0.98] dark:border-zinc-800 dark:hover:bg-zinc-800"
                            @click="speakCurrentItem">

                            <span class="material-symbols-outlined text-lg">
                                volume_up
                            </span>

                            <span>
                                Hear
                            </span>

                        </button>

                        <!-- Next -->
                        <button type="button"
                            class="flex h-12 items-center justify-center gap-2 rounded-xl bg-zinc-900 font-medium text-white transition hover:bg-zinc-800 active:scale-[0.98] dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-200"
                            @click="nextVocabulary">

                            <span>
                                {{ currentIndex === vocabulary.length - 1 ? "Finish" : "Next" }}
                            </span>

                            <span class="material-symbols-outlined text-lg">
                                arrow_forward
                            </span>

                        </button>

                    </div>

                </section>

            </template>

            <!-- Guess Image from Audio -->
            <template v-else-if="
  currentScreen === 'learning' &&
  selectedMode === 'audio_to_image'
">

                <!-- Header -->
                <header class="pt-4">

                    <div class="flex items-center gap-3">

                        <button type="button"
                            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-zinc-200 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800"
                            aria-label="Back to learning modes" @click="goToModeSelection">
                            <span class="material-symbols-outlined">
                                arrow_back
                            </span>
                        </button>

                        <div class="min-w-0">

                            <p class="text-xs font-medium text-zinc-400">
                                {{ currentCategory?.name }}
                            </p>

                            <h1 class="mt-0.5 truncate font-display text-lg font-semibold">
                                Audio → Image
                            </h1>

                        </div>

                    </div>

                </header>


                <!-- Quiz -->
                <template v-if="!quizFinished">

                    <!-- Progress -->
                    <section class="mt-8">

                        <div class="flex items-center justify-between">

                            <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                                Question
                            </p>

                            <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                                {{ currentIndex + 1 }} / {{ quizItems.length }}
                            </p>

                        </div>

                        <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-zinc-100 dark:bg-zinc-800">

                            <div class="h-full rounded-full bg-zinc-900 transition-all duration-300 dark:bg-zinc-100"
                                :style="{
          width: `${((currentIndex + 1) / quizItems.length) * 100}%`
        }"></div>

                        </div>

                    </section>


                    <!-- Audio Prompt -->
                    <section class="mt-8">

                        <button type="button"
                            class="mx-auto flex h-24 w-24 items-center justify-center rounded-full border border-zinc-300 bg-white transition hover:bg-zinc-100 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:hover:bg-zinc-800"
                            aria-label="Play pronunciation" @click="speakVocabulary(quizItems[currentIndex])">

                            <span class="material-symbols-outlined text-4xl">
                                volume_up
                            </span>

                        </button>

                        <p class="mt-4 text-center text-sm text-zinc-500 dark:text-zinc-400">
                            Listen and choose the matching image.
                        </p>

                    </section>


                    <!-- Answer Options -->
                    <section class="mt-8">

                        <div class="grid grid-cols-2 gap-3">

                            <button v-for="item in quizOptions" :key="item.id" type="button"
                                class="group overflow-hidden rounded-xl border bg-white text-left transition active:scale-[0.98] dark:bg-zinc-900"
                                :class="{
          'border-zinc-200 hover:border-zinc-400 dark:border-zinc-800 dark:hover:border-zinc-600':
            !quizAnswered,

          'border-zinc-900 dark:border-zinc-100':
            quizAnswered && item.id === quizItems[currentIndex].id,

          'border-zinc-300 opacity-60 dark:border-zinc-700':
            quizAnswered && item.id !== quizItems[currentIndex].id
        }" :disabled="quizAnswered" @click="answerAudioQuestion(item)">

                                <div class="aspect-square overflow-hidden bg-zinc-100 dark:bg-zinc-800">

                                    <img :src="getVocabularyImage(item, selectedCategory)"
                                        :alt="getVocabularyText(item, selectedLanguage)"
                                        class="h-full w-full object-cover" loading="lazy"
                                        @error="$event.target.style.display = 'none'">

                                </div>

                            </button>

                        </div>

                    </section>


                    <!-- Feedback -->
                    <section v-if="quizAnswered" class="mt-6">

                        <div class="surface p-4">

                            <div class="flex items-start gap-3">

                                <span class="material-symbols-outlined">
                                    {{ quizCorrect ? "check_circle" : "cancel" }}
                                </span>

                                <div class="min-w-0">

                                    <p class="font-display text-sm font-semibold">
                                        {{ quizCorrect ? "Correct" : "Not quite" }}
                                    </p>

                                    <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400"
                                        :dir="selectedLanguage === 'arabic' ? 'rtl' : 'ltr'">
                                        Answer:
                                        {{ getVocabularyText(quizItems[currentIndex], selectedLanguage) }}
                                    </p>

                                </div>

                            </div>

                        </div>


                        <button type="button"
                            class="mt-3 flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-zinc-900 font-medium text-white transition hover:bg-zinc-800 active:scale-[0.98] dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-200"
                            @click="nextAudioQuestion">

                            <span>
                                {{ currentIndex === quizItems.length - 1 ? "Finish" : "Next" }}
                            </span>

                            <span class="material-symbols-outlined text-lg">
                                arrow_forward
                            </span>

                        </button>

                    </section>

                </template>


                <!-- Results -->
                <template v-else>

                    <section class="mt-12 text-center">

                        <div
                            class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-zinc-100 dark:bg-zinc-800">

                            <span class="material-symbols-outlined text-3xl">
                                check
                            </span>

                        </div>

                        <p class="mt-6 text-sm font-medium text-zinc-500 dark:text-zinc-400">
                            Session complete
                        </p>

                        <h2 class="mt-2 font-display text-3xl font-bold tracking-tight">
                            {{ score }} / {{ quizItems.length }}
                        </h2>

                        <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">
                            Correct answers
                        </p>

                    </section>

                    <section class="mt-8 grid grid-cols-2 gap-3">

                        <button type="button"
                            class="flex h-12 items-center justify-center gap-2 rounded-xl border border-zinc-200 font-medium transition hover:bg-zinc-100 active:scale-[0.98] dark:border-zinc-800 dark:hover:bg-zinc-800"
                            @click="goToModeSelection">
                            <span class="material-symbols-outlined text-lg">
                                arrow_back
                            </span>

                            Modes
                        </button>

                        <button type="button"
                            class="flex h-12 items-center justify-center gap-2 rounded-xl bg-zinc-900 font-medium text-white transition hover:bg-zinc-800 active:scale-[0.98] dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-200"
                            @click="restartAudioToImage">
                            <span class="material-symbols-outlined text-lg">
                                replay
                            </span>

                            Retry
                        </button>

                    </section>

                </template>

            </template>

        </main>

    </div>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Application -->
    <script src="./js/data.js"></script>
    <script src="./js/parser.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/app.js"></script>


</body>

</html>
