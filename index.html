<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocabs</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="app" class="app-shell">

        <main class="app-container">
      
          <!-- Loading -->
          <div
            v-if="isLoading"
            class="flex min-h-[70vh] items-center justify-center"
          >
            <div class="flex items-center gap-3">
      
              <span class="material-symbols-outlined animate-spin">
                progress_activity
              </span>
      
              <span class="text-sm text-zinc-500 dark:text-zinc-400">
                Loading...
              </span>
      
            </div>
          </div>
      
          <!-- Error -->
          <div
            v-else-if="errorMessage"
            class="surface p-5"
          >
            <div class="flex items-start gap-3">
      
              <span class="material-symbols-outlined text-zinc-600 dark:text-zinc-300">
                error
              </span>
      
              <div>
                <h2 class="font-display font-semibold">
                  Something went wrong
                </h2>
      
                <p class="mt-1 text-sm leading-5 text-zinc-500 dark:text-zinc-400">
                  {{ errorMessage }}
                </p>
              </div>
      
            </div>
          </div>
      
          <!-- Language Selection -->
          <template v-else-if="currentScreen === 'language'">
      
            <header class="pt-4">
      
              <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                Vocabulary Learning
              </p>
      
              <h1 class="mt-2 font-display text-3xl font-bold tracking-tight">
                Choose a language
              </h1>
      
              <p class="mt-2 max-w-sm text-sm leading-6 text-zinc-500 dark:text-zinc-400">
                Select the language you want to use for your vocabulary session.
              </p>
      
            </header>
      
            <section class="mt-8">
      
              <div class="space-y-2">
      
                <button
                  v-for="language in languages"
                  :key="language.id"
                  type="button"
                  class="group flex w-full items-center gap-4 rounded-xl border border-zinc-200 bg-white p-4 text-left transition hover:border-zinc-400 hover:bg-zinc-50 active:scale-[0.99] dark:border-zinc-800 dark:bg-zinc-900 dark:hover:border-zinc-600 dark:hover:bg-zinc-800"
                  @click="selectLanguage(language.id)"
                >
      
                  <!-- Language Icon -->
                  <div
                    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-zinc-100 dark:bg-zinc-800"
                  >
                    <span
                      v-if="language.id === 'arabic'"
                      class="text-lg font-semibold"
                      dir="rtl"
                    >
                      ع
                    </span>
      
                    <span
                      v-else-if="language.id === 'french'"
                      class="text-lg font-semibold"
                    >
                      Fr
                    </span>
      
                    <span
                      v-else-if="language.id === 'english_us'"
                      class="text-lg font-semibold"
                    >
                      En
                    </span>
      
                    <span
                      v-else-if="language.id === 'indonesian'"
                      class="text-lg font-semibold"
                    >
                      Id
                    </span>
      
                    <span
                      v-else
                      class="text-lg font-semibold"
                    >
                      Mg
                    </span>
                  </div>
      
                  <!-- Language Information -->
                  <div class="min-w-0 flex-1">
      
                    <div class="flex items-center justify-between gap-3">
      
                      <h2 class="font-display text-sm font-semibold">
                        {{ language.name }}
                      </h2>
      
                      <span
                        class="material-symbols-outlined text-zinc-400 transition-transform group-hover:translate-x-0.5"
                      >
                        arrow_forward
                      </span>
      
                    </div>
      
                    <p
                      class="mt-1 text-sm text-zinc-500 dark:text-zinc-400"
                      :dir="language.id === 'arabic' ? 'rtl' : 'ltr'"
                    >
                      {{ language.nativeName }}
                    </p>
      
                  </div>
      
                </button>
      
              </div>
      
            </section>
      
            <footer class="mt-8">
      
              <p class="text-center text-xs text-zinc-400">
                {{ languageCount }} languages available
              </p>
      
            </footer>
      
          </template>
      
          <!-- Placeholder for remaining screens -->
          <template v-else>
      
            <header class="flex items-center gap-3">
      
              <button
                type="button"
                class="flex h-10 w-10 items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-800"
                @click="goToLanguageSelection"
              >
                <span class="material-symbols-outlined">
                  arrow_back
                </span>
              </button>
      
              <div>
                <p class="text-xs text-zinc-500 dark:text-zinc-400">
                  Selected language
                </p>
      
                <h1 class="font-display font-semibold">
                  {{ currentLanguage?.name }}
                </h1>
              </div>
      
            </header>
      
            <section class="mt-8 surface p-5">
      
              <p class="text-sm text-zinc-500 dark:text-zinc-400">
                Next screen:
              </p>
      
              <h2 class="mt-1 font-display text-xl font-semibold">
                {{ currentScreen }}
              </h2>
      
            </section>
      
          </template>
      
        </main>
      
      </div>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Application -->
    <script src="./js/parser.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>


</body>

</html>
