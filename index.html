<!DOCTYPE html>
<html lang="en">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

  <title>Vocabs</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
