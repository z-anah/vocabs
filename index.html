<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocabs</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="app" class="app-shell">
        <main class="app-container">

            <header class="space-y-1">
                <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">
                    Vocabulary Learning
                </p>

                <h1 class="font-display text-2xl font-bold tracking-tight">
                    Vocabs
                </h1>
            </header>

            <section class="mt-8">
                <div class="surface p-5">

                    <div class="flex items-start gap-3">
                        <div
                            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-zinc-100 dark:bg-zinc-800">
                            <span class="material-symbols-outlined text-zinc-700 dark:text-zinc-200">
                                menu_book
                            </span>
                        </div>

                        <div>
                            <h2 class="font-display text-base font-semibold">
                                Choose a category
                            </h2>

                            <p class="mt-1 text-sm leading-5 text-zinc-500 dark:text-zinc-400">
                                Select a vocabulary topic to start learning.
                            </p>
                        </div>
                    </div>

                </div>
            </section>

        </main>
    </div>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Application -->
    <script src="./js/app.js"></script>
</body>

</html>
